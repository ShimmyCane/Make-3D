<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make 3D</title>
<link rel="stylesheet" href="css/app.css?v=3.05">
</head>
<body class="front-page">
<!-- The front page. Light on purpose: it loads no 3-D engine and no sample models. Picking a project opens
     viewer.html?model=<id>, which loads that one model. The cloud library loads only when a request is saved. -->
<main class="front" aria-labelledby="frontTitle">
  <div class="front-card">
    <div class="front-head">
      <div>
        <h1 id="frontTitle">Make 3D</h1>
        <p class="hint">Pick a category, then a project. It opens the latest version.</p>
      </div>
      <a class="btn small" id="keepLink" href="viewer.html">Open my last model</a>
    </div>
    <div class="fcats" id="frontCats"></div>
    <p class="hint" id="frontStatus" role="status" hidden></p>
  </div>
</main>

<div class="reqmodal" id="reqPanel" role="dialog" aria-modal="true" aria-labelledby="reqTitle" hidden>
  <div class="req-card">
    <h2 id="reqTitle">What would you like a 3-D model of?</h2>
    <p class="hint" id="reqCat"></p>
    <label class="field">Describe it
      <textarea id="reqBody" rows="5" maxlength="2000" placeholder="For example: a garden shed with a green roof and two windows"></textarea>
    </label>
    <p class="err" id="reqErr" hidden></p>
    <p class="hint" id="reqNote" hidden></p>
    <div class="btn-row">
      <button class="btn primary" id="reqSave" type="button">Save request</button>
      <button class="btn ghost" id="reqCancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<script src="js/ui/front.js?v=3.05"></script>
<script src="js/front_index.js?v=3.05"></script>
<script src="js/ui/front_page.js?v=3.05"></script>
</body>
</html>
